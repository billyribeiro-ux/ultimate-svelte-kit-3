<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />

		<!--
			Preload the two faces the first paint needs.

			`crossorigin` is required even though the file is same-origin: fonts are
			always fetched in CORS mode, and a preload without it is a second,
			separate request that the CSS cannot use. The symptom is a font that
			downloads twice and still causes a flash.
		-->
		<link
			rel="preload"
			href="/fonts/instrument-sans-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrains-mono-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<script>
			/*
				THEME, BEFORE FIRST PAINT

				Reading the stored theme in a component means the page renders in the
				default first and corrects itself a frame later — a white flash on
				every load for anybody using dark mode. Four lines of blocking script
				in the head is the honest fix; there is no asynchronous way to know
				something before you paint.
			*/
			try {
				const stored = localStorage.getItem('tessera:theme');
				if (stored === 'dark' || stored === 'light') {
					document.documentElement.dataset.theme = stored;
				}
			} catch {
				// Private mode, or storage disabled. The media query still applies.
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
