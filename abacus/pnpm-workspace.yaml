# Not a workspace — a single package. This file exists for one line.
#
# pnpm 12 refuses to run a dependency's install scripts unless you say so by
# name, which is the correct default: `postinstall` is arbitrary code from a
# transitive dependency you have never read. esbuild needs it to unpack its
# platform binary, and Vite needs esbuild, so without this the dev server
# starts and then dies on the first transform.
allowBuilds:
  esbuild: true

# pnpm 12 also waits before it will install a version that was published very
# recently — a supply-chain delay, so a compromised release has time to be
# noticed and pulled before it reaches a lockfile. The versions below were
# younger than that when they were pinned; pnpm appends each one here when it
# installs it, and the entry is the record that somebody chose to take it early.
minimumReleaseAgeExclude:
  - '@libsql/client@0.18.0'
  - '@libsql/core@0.18.0'
  - '@simplewebauthn/browser@14.0.0'
  - '@simplewebauthn/server@14.0.0'
  - '@types/node@24.19.2'
  - eslint-plugin-svelte@3.23.1
  - phosphor-svelte@3.1.1
