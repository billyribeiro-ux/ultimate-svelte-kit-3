# Refuse to install under a Node older than `engines.node` in package.json.
# pnpm 12 reads its settings from this file. `engine-strict=true` in `.npmrc` is
# npm's spelling, and pnpm 12 ignores it: the install finishes, exit 0, with no
# warning at all. With this line the same install stops before touching a
# package, with ERR_PNPM_UNSUPPORTED_ENGINE.
engineStrict: true

allowBuilds:
  esbuild: true

# pnpm 12 holds back any package published less than a day ago (`minimumReleaseAge`,
# default 1440 minutes) as a supply-chain precaution. These three were younger than
# that when the toolchain was pinned on 2026-10-09, so pnpm wrote them here itself.
# Safe to delete once the versions are a day old.
minimumReleaseAgeExclude:
  - '@types/node@24.19.2'
  - eslint-plugin-svelte@3.23.1
  - phosphor-svelte@3.1.1
