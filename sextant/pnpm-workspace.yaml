# Not a workspace — a single package. This file exists because pnpm reads its
# settings from here, and pnpm 12 fails the install on a key it does not
# recognise, so every setting below is one it checks.

# pnpm refuses to run a dependency's install scripts unless you say so by
# name, which is the correct default: `postinstall` is arbitrary code from a
# transitive dependency you have never read. esbuild needs it to unpack its
# platform binary, and Vite needs esbuild, so without this the dev server
# starts and then dies on the first transform.
allowBuilds:
  esbuild: true

# pnpm 12 refuses a version published less than `minimumReleaseAge` ago (a day,
# by default), so a malicious release has time to be noticed and pulled before
# it reaches you. These three were published on 2026-10-09, inside that window,
# and are here only because the migration targets the latest release of
# everything as of that date — nothing in SvelteKit 3.0.1 needs them, and the
# previous patch of each would run this project just as well. Naming the exact
# versions lets the policy through for them and nothing else; once the day has
# passed the list is harmless and can go.
minimumReleaseAgeExclude:
  - '@types/node@24.19.2'
  - eslint-plugin-svelte@3.23.1
  - phosphor-svelte@3.1.1

# Better Auth 1.7.7 declares `@sveltejs/kit` as an *optional* peer at `^2.0.0`
# and has not widened the range past 2 yet. It uses only what did not change in
# Kit 3 — `svelteKitHandler` takes `resolve` and `building` as arguments (see
# `src/hooks.server.ts`) — and the end-to-end suite signs in through it against
# 3.0.1, so the warning is noise rather than information. Remove this when its
# release notes say "SvelteKit 3"; `pnpm peers check` will say when it is time.
peerDependencyRules:
  allowedVersions:
    'better-auth>@sveltejs/kit': '3'
