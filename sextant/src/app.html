<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			The fonts are preloaded by the `preload` filter in `hooks.server.ts`,
			not by hand.

			They used to be two `<link rel="preload">` tags here, pointing at copies in
			`static/fonts`, because a bundled font's URL carries a content hash that
			nothing could predict. Those copies matched no `@font-face` — the
			stylesheet uses the bundled files — so the preload fetched 88KB the page
			never used and then downloaded the real faces again. SvelteKit 3 gives the
			filter the source `filename`, which is the thing that is stable.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
