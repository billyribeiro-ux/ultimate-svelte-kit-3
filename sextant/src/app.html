<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			Preload, with `crossorigin`.

			A font is fetched in CORS mode whether or not you ask, so a preload without
			`crossorigin` fetches the file a second time and the preload achieves
			nothing except doubling the bytes. It is the most common way this tag is
			written wrong, and the devtools warning about it is easy to miss.
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
