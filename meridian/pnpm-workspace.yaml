# A workspace of two: the app at the root, and the library it publishes in
# `packages/waypoint`. The app depends on the library as `workspace:*`, which
# links the folder rather than downloading a tarball — so the app is the
# library's first consumer, and the packaging is proved on every build.
packages:
  - 'packages/*'

# pnpm refuses to run a dependency's install scripts unless you say so by
# name, which is the correct default: `postinstall` is arbitrary code from a
# transitive dependency you have never read. esbuild needs it to unpack its
# platform binary, and Vite needs esbuild. (pnpm 12 also fails the install on
# a key in this file it does not recognise, so every setting here is checked.)
allowBuilds:
  esbuild: true

# pnpm can refuse a version published less than `minimumReleaseAge` ago, so a
# malicious release has time to be noticed and pulled before it reaches you.
# These are the versions taken inside that window on purpose — each one was
# the release that made the toolchain below line up — named so the policy
# lets exactly them through and nothing else.
minimumReleaseAgeExclude:
  - '@libsql/client@0.18.0'
  - '@libsql/core@0.18.0'
  - '@types/node@24.19.2'
  - eslint-plugin-svelte@3.23.1
  - phosphor-svelte@3.1.1

# runed 0.37.1 declares `@sveltejs/kit` as an *optional* peer at `^2.21.0` and
# has not widened the range past 2 yet. It reads only `$app/state`, which did
# not change in Kit 3, and the end-to-end suite proves it against 3.1.0, so the
# unmet-peer warning is noise rather than information. Remove the line when its
# release notes say "SvelteKit 3"; `pnpm peers check` will tell you when it is
# time. Better Auth had the same line until 1.7.10, whose peer range became
# `^2.0.0 || ^3.0.0`: an allowance for a peer that is met is a rule that can
# only ever hide the next real mismatch, so it went with the release that made
# it unnecessary.
peerDependencyRules:
  allowedVersions:
    'runed>@sveltejs/kit': '3'

# pnpm 12.11 added a second kind of approval beside build scripts: a package may
# ship "agent skills" (instructions for a coding agent), and pnpm links them
# into the project's skill directories once somebody says so by name.
# @tanstack/svelte-table 9.3 is the first dependency here to ship some (a
# getting-started guide, the v8 -> v9 migration this project is already past, and
# a table-state guide). An agent working in this repository should be steered by
# `AGENTS.md` and the code, not by whatever a dependency bundles, so the answer
# is a recorded denial, which also stops pnpm offering it on every install.
permissions:
  '@tanstack/svelte-table':
    skills: false
