<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			FONT PRELOADS
			=============

			These two lines are the highest-leverage performance change in the whole project.

			Without them the browser must: fetch HTML → fetch CSS → parse CSS → discover
			the @font-face → fetch the font. That's a serial chain, and the font is the
			last link. Text renders in the fallback and then visibly swaps, late.

			`rel="preload"` tells the browser to start fetching the font the moment it
			reads the <head>, in parallel with the CSS. On a 4G connection this typically
			pulls first paint of real text forward by hundreds of milliseconds.

			Three details that are easy to get wrong:
			  - `as="font"` sets the correct request priority and Accept header.
			  - `type="font/woff2"` lets a browser skip a format it can't use.
			  - `crossorigin` is REQUIRED even for same-origin fonts. Font requests are
			    always made in CORS mode; omit it and the browser downloads the file
			    twice — once for the preload, once for the real request. The preload
			    then makes things slower, which is a genuinely nasty bug to spot.

			We preload only the two Latin variable files we actually use. Preloading
			everything is the classic mistake: it makes every resource high priority,
			which is the same as making none of them high priority.
		-->
		<link
			rel="preload"
			href="/fonts/montserrat-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/sofia-sans-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!--
			Sets the browser UI colour on mobile before any JavaScript runs, so the
			address bar doesn't flash white on a dark page.
		-->
		<meta name="theme-color" content="#05070c" />

		<!--
			`color-scheme` tells the browser to render native widgets — scrollbars,
			form controls, the address bar — in dark mode. Without it you get a dark
			page with jarring light scrollbars.
		-->
		<meta name="color-scheme" content="dark" />

		<!--
			THE MOTION GATE
			===============

			This is the only inline script on the site, and it has to be inline. It must
			run before the browser paints a single pixel, and an external script — even a
			tiny one — is a network round-trip during which the page has already drawn.

			It adds `motion-pending` to <html>, which is what `motion.css` keys its
			"hidden until animated" rules off. That prevents the flash of fully-visible
			content that you get if you wait for GSAP to load before hiding anything.

			Three safeguards, because hiding content is dangerous:

			  1. If the user prefers reduced motion, the class is never added — so they
			     see the content immediately AND never download the animation library.
			  2. A 2.5 second failsafe removes it regardless. If GSAP fails to load —
			     a blocked request, a chunk that 404s after a bad deploy, an extension
			     eating it — the content still appears.
			  3. Any exception at all removes it. This script must never be the reason
			     a page is blank.

			If you enable a Content Security Policy later, this needs a nonce or hash.
			SvelteKit can generate that for you via the `csp` config option.
		-->
		<script>
			(function () {
				var root = document.documentElement;
				try {
					var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (!reduced) {
						root.classList.add('motion-pending');
						setTimeout(function () {
							root.classList.remove('motion-pending');
						}, 2500);
					}
				} catch (error) {
					root.classList.remove('motion-pending');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			`data-sveltekit-preload-data="hover"` on <body> makes SvelteKit start
			loading a route's code and data when the pointer enters a link — roughly
			200ms before the click lands. Navigation then feels instant.

			On touch devices there's no hover, so it falls back to firing on touchstart,
			which still buys the ~100ms before touchend.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
