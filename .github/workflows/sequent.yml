# Project 3 — Sequent, and its course.
#
# `verify` runs exactly what a developer runs before pushing: `pnpm run verify`
# — type-check across the six workspace packages, the Vitest suite, the
# production build of the web app, and the six browser tests against
# `node build`, on an `e2e.db` they seed fresh. `lint` is not part of that
# script; it runs afterwards for information, and does not decide the job.
#
# `course` proves the course: the chapters are built, every quoted block is in
# the file it names, verbatim or as a marked excerpt (`verify.js`, which reads
# the pages the build just wrote), and the committed `dist/` is the one the build
# produces. The course has no page checker, so the job needs neither the
# workspace's dependencies nor a browser.
#
# Path filters keep this from running for the other seven projects; they are
# verified the same way from their own folders.

name: sequent

on:
  push:
    paths:
      - 'sequent/**'
      - 'sequent-course/**'
      - '.github/workflows/sequent.yml'
  pull_request:
    paths:
      - 'sequent/**'
      - 'sequent-course/**'
      - '.github/workflows/sequent.yml'

concurrency:
  group: sequent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sequent

jobs:
  verify:
    name: verify (check · lint · unit · build · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # The two names `apps/web/src/env.ts` declares. `PUBLIC_ORIGIN` is `static`:
      # the build refuses to run without it, and the browser tests post to port
      # 4173, so it has to be that origin. The end-to-end suite pins its own
      # `DATABASE_URL` in `playwright.config.ts`; this one covers `svelte-kit
      # sync` and the build.
      DATABASE_URL: file:e2e.db
      PUBLIC_ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sequent/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: sequent/.nvmrc
          cache: pnpm
          cache-dependency-path: sequent/pnpm-lock.yaml

      # The whole workspace: the web app, the engine, the worker and the packages.
      - run: pnpm install --frozen-lockfile

      # Playwright is a dependency of the web app alone, so the workspace root
      # has no `playwright` to run. The browser tests are the only user.
      - run: pnpm --filter @sequent/web exec playwright install --with-deps chromium

      # There is no database to prepare: the end-to-end suite's web server seeds
      # `e2e.db` itself, in the same command that starts it.
      - run: pnpm run verify

      # `lint` (Prettier, then ESLint) is not part of sequent's `verify`, so it
      # runs as a step of its own. It passes, and it is a gate like every other
      # step: a lint that cannot fail the build stops being read.
      - run: pnpm run lint

      # `verify` must leave git nothing to see: no tracked file rewritten, no
      # new file that `.gitignore` does not cover.
      - name: the working tree is as the checkout left it
        run: |
          changed=$(git -C .. status --porcelain -- sequent sequent-course)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: sequent/apps/web/test-results
          if-no-files-found: ignore

  course:
    name: course (build · verify quotes · dist in sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: sequent/.nvmrc

      # `build.js` and `verify.js` read the workspace's source files and import
      # nothing but Node's own modules, so there is no install here. A course
      # with a page checker (`tools/check-dist.js`) borrows the project's
      # Playwright and installs the dependencies and Chromium; this one has none.
      #
      # Build first: `verify.js` checks the pages in `dist/`, so it has to read
      # the ones this checkout's chapters produce, not whatever was committed.
      - run: node ../sequent-course/build.js
      - run: node ../sequent-course/verify.js

      # The committed `dist/` must be the one the build produces.
      - run: git -C .. diff --exit-code --stat -- sequent-course/dist

      # `git diff` does not see a page the build wrote and nobody committed; this
      # does, and it covers the project as well as the course.
      - name: the working tree is as the checkout left it
        run: |
          changed=$(git -C .. status --porcelain -- sequent sequent-course)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi
