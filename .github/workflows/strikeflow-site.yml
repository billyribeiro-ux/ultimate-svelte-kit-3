# Project 1 — StrikeFlow, and its course.
#
# `verify` runs what a developer runs before pushing. This project has no single
# `verify` script, so the job runs its parts one step each: type-check, prettier
# + eslint, unit and browser tests, the production build, and the end-to-end
# suite on a desktop and a phone profile against that build, with a second
# server over it whose lead store is broken on purpose.
#
# `course` proves the course: the chapters are built, every quoted block is in
# the file it names, verbatim, re-indented or as a marked excerpt (`verify.js`,
# which reads the pages the build just wrote), and the committed `dist/` is the
# one the build produces. The course has no page checker, so the job needs
# neither the project's dependencies nor a browser.
#
# Path filters keep this from running for the other seven projects; they are
# verified the same way from their own folders.

name: strikeflow-site

on:
  push:
    paths:
      - 'strikeflow-site/**'
      - 'strikeflow-course/**'
      - '.github/workflows/strikeflow-site.yml'
  pull_request:
    paths:
      - 'strikeflow-site/**'
      - 'strikeflow-course/**'
      - '.github/workflows/strikeflow-site.yml'

concurrency:
  group: strikeflow-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: strikeflow-site

jobs:
  verify:
    name: verify (check · lint · unit · build · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No variables beyond `CI`. The three `src/env.ts` declares are all optional
    # with a default — `PUBLIC_SITE_URL`, `LEADS_DIR` and `EBOOK_TOKEN_SECRET` —
    # and the project was checked locally without setting any of them. Without
    # the token secret the server makes an ephemeral key at boot and says so in
    # the log; the suite passes with it.
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: strikeflow-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: strikeflow-site/.nvmrc
          cache: pnpm
          cache-dependency-path: strikeflow-site/pnpm-lock.yaml

      # `prepare` copies the fonts out of `node_modules` and syncs the types.
      - run: pnpm install --frozen-lockfile

      # One Chromium serves both Vitest's browser project and Playwright.
      # `test:e2e` runs a bare `playwright install` itself, which downloads
      # browsers but installs none of the system libraries Chromium needs; this
      # step does.
      - run: pnpm exec playwright install --with-deps chromium

      # There is no database to prepare: the sign-up form appends its leads to a
      # file under `.data`, which the server creates when the first one arrives.
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test:unit --run
      - run: pnpm run build
      - run: pnpm run test:e2e

      # The suite must leave git nothing to see: no tracked file rewritten, no
      # new file that `.gitignore` does not cover.
      - name: the working tree is as the checkout left it
        run: |
          changed=$(git -C .. status --porcelain -- strikeflow-site strikeflow-course)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: strikeflow-site/test-results
          if-no-files-found: ignore

  course:
    name: course (build · verify quotes · dist in sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: strikeflow-site/.nvmrc

      # `build.js` and `verify.js` read the project's source files and import
      # nothing but Node's own modules, so there is no install here. A course
      # with a page checker (`tools/check-dist.js`) borrows the project's
      # Playwright and installs the dependencies and Chromium; this one has none.
      #
      # Build first: `verify.js` checks the pages in `dist/`, so it has to read
      # the ones this checkout's chapters produce, not whatever was committed.
      - run: node ../strikeflow-course/build.js
      - run: node ../strikeflow-course/verify.js

      # The committed `dist/` must be the one the build produces.
      - run: git -C .. diff --exit-code --stat -- strikeflow-course/dist

      # `git diff` does not see a page the build wrote and nobody committed; this
      # does, and it covers the project as well as the course.
      - name: the working tree is as the checkout left it
        run: |
          changed=$(git -C .. status --porcelain -- strikeflow-site strikeflow-course)
          if [ -n "$changed" ]; then echo "$changed"; exit 1; fi
