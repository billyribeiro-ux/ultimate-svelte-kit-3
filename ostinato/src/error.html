<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% — Ostinato</title>
		<!--
			The page SvelteKit serves when nothing else can: a request no function
			owns, or an error so early that no layout has rendered. It has no
			stylesheet to import — there may be no build to import it from — so
			the few rules it needs are inline, and they use the same tokens by
			value rather than by name.
		-->
		<style>
			html {
				color-scheme: dark light;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				background: light-dark(#f4f2ee, #0b0b0f);
				color: light-dark(#1b1a18, #f1efe9);
				font-family: system-ui, sans-serif;
				text-align: center;
				padding: 2rem;
			}
			main {
				max-width: 32rem;
			}
			.status {
				font-family: ui-monospace, monospace;
				font-size: 4rem;
				font-weight: 700;
				color: light-dark(#c9631a, #ffb347);
				line-height: 1;
				margin: 0 0 1rem;
			}
			p {
				color: light-dark(#5f5a52, #a6a3b3);
				line-height: 1.5;
			}
			a {
				color: light-dark(#c9631a, #ffb347);
			}
		</style>
	</head>
	<body>
		<main>
			<p class="status">%sveltekit.status%</p>
			<p>%sveltekit.error.message%</p>
			<p><a href="/">Back to the studio</a></p>
		</main>
	</body>
</html>
