<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!--
			The fonts are preloaded by the `preload` filter in `hooks.server.ts`,
			which matches on the source `filename` SvelteKit 3 hands it. Nothing here
			has to know what hash the bundler gave them.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
